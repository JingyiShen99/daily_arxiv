name: Daily arXiv Digest

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write # 赋予写入权限，以便保存去重记录

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install arxiv openai requests PyMuPDF

      - name: Run Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python daily_arxiv.py

      # 自动将更新后的 pushed_papers.json 提交并保存回 GitHub 仓库
      - name: Commit & Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pushed_papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update pushed papers history" && git push)
